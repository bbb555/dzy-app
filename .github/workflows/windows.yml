name: Windows Build

# 队长云加速 · 电脑端（Windows）构建
# 产出：① Inno Setup 安装包 DzyCloud_Setup_v1.0.0.exe ② 免安装 zip（exe + 内核 + wintun）
on:
  workflow_dispatch:
  push:
    branches:
      - ci/windows-build

jobs:
  build-windows:
    runs-on: windows-2022
    env:
      DZY_CONFIG_KEY: ${{ secrets.DZY_CONFIG_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: 诊断：已安装的 Visual Studio
        continue-on-error: true
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          cmd /c dir "C:\Program Files\Microsoft Visual Studio"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - run: flutter --version
      - run: flutter pub get

      - name: Build Windows (release)
        shell: pwsh
        run: |
          flutter build windows --release `
            --dart-define=DZY_CONFIG_KEY="$env:DZY_CONFIG_KEY" `
            --dart-define=APP_VERSION=1.0.0

      - name: 校验内核与驱动已随包
        shell: pwsh
        run: |
          $need = @(
            "build\windows\x64\runner\Release\dzy-cloud.exe",
            "assets\bin\windows\xray.exe",
            "assets\bin\windows\sing-box.exe",
            "assets\bin\windows\wintun.dll"
          )
          foreach ($f in $need) {
            if (-not (Test-Path $f)) { throw "缺少必要文件: $f" }
            Write-Host ("OK  {0}  {1:N1} MB" -f $f, ((Get-Item $f).Length / 1MB))
          }

      - name: 免安装包（zip）
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Recurse -Force build\windows\x64\runner\Release\* dist\
          New-Item -ItemType Directory -Force -Path dist\bin | Out-Null
          Copy-Item assets\bin\windows\* dist\bin\ -Force
          Copy-Item assets\bin\geoip.dat dist\bin\ -Force
          Copy-Item assets\bin\geosite.dat dist\bin\ -Force
          Compress-Archive -Path dist\* -DestinationPath DzyCloud-windows-portable.zip -Force

      - name: 安装 Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: 生成安装包（Inno Setup）
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "windows\dzycloud_setup.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC 编译失败" }
          Get-ChildItem build\windows\x64\runner\Output | Select-Object Name, Length | Format-Table

      - uses: actions/upload-artifact@v4
        with:
          name: dzy-cloud-windows
          path: |
            build/windows/x64/runner/Output/*.exe
            DzyCloud-windows-portable.zip
          retention-days: 30
