name: Android Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (e.g. v1.0.1)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.7'
          cache: true

      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then TAG="${{ github.event.inputs.version }}"; else TAG="${GITHUB_REF_NAME}"; fi
          NAME="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          # versionCode 由版本号推导（1.1.0 -> 10100），保证单调递增；
          # Flutter split-per-abi 会再加 ABI 偏移 abi*1000（arm64: 12100，armv7: 11100）
          IFS=. read -r MAJ MIN PAT <<< "${NAME%%-*}"
          NUM=$(( ${MAJ:-0} * 10000 + ${MIN:-0} * 100 + ${PAT:-0} ))
          echo "number=$NUM" >> "$GITHUB_OUTPUT"

      - name: Set up signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
          keytool -list -keystore android/app/release.jks -storepass "$KEYSTORE_PASSWORD" > /dev/null && echo "keystore OK"

      - run: flutter --version
      - run: flutter pub get

      - name: Build APK
        env:
          DZY_CONFIG_KEY: ${{ secrets.DZY_CONFIG_KEY }}
        run: |
          # v1.3.0 加固：Dart 代码混淆；符号表单独保存为构建产物（用于还原崩溃堆栈），不随 APK 发布
          flutter build apk --release --split-per-abi \
            --target-platform android-arm64,android-arm \
            --obfuscate --split-debug-info=build/debug-info \
            --build-name=${{ steps.ver.outputs.name }} \
            --build-number=${{ steps.ver.outputs.number }} \
            --dart-define=DZY_CONFIG_KEY="$DZY_CONFIG_KEY" \
            --dart-define=APP_VERSION=${{ steps.ver.outputs.name }}

      - name: Rename APKs
        run: |
          mkdir -p dist
          cd build/app/outputs/flutter-apk
          for f in app-*-release.apk; do
            abi="${f#app-}"; abi="${abi%-release.apk}"
            cp "$f" "../../../../dist/dzy-cloud-${{ steps.ver.outputs.tag }}-${abi}.apk"
          done
          ls -la ../../../../dist

      - uses: actions/upload-artifact@v4
        with:
          name: dzy-cloud-apk-${{ steps.ver.outputs.tag }}
          path: dist/*.apk

      # 混淆符号表（Dart --split-debug-info + R8 mapping.txt）：仅作为 Actions 构建产物保存，不公开发布
      - name: Collect symbols
        run: |
          mkdir -p symbols
          cp -r build/debug-info symbols/dart-debug-info
          if [ -f build/app/outputs/mapping/release/mapping.txt ]; then cp build/app/outputs/mapping/release/mapping.txt symbols/r8-mapping.txt; fi
          ls -laR symbols | head -50

      - uses: actions/upload-artifact@v4
        with:
          name: dzy-cloud-symbols-${{ steps.ver.outputs.tag }}
          path: symbols/
          retention-days: 90

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: 队长云加速 ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body: |
            队长云加速 Android ${{ steps.ver.outputs.tag }}
            - 大多数手机请下载 arm64-v8a 版本；老旧 32 位设备用 armeabi-v7a。
            - 使用官网 (https://vip.dzgg666.de5.net) 账号的邮箱和密码登录。
            - v1.3.0：连接后自动验证能否上网；线路不可用时自动切换；本机流量统计；代码混淆与防抓包加固。
          files: dist/*.apk
          make_latest: true
