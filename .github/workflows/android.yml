name: Android Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (e.g. v1.0.1)'
        required: true
        default: 'v1.0.0'
      prerelease:
        description: '作为预发布（不设为 GitHub latest，App 的 GitHub 回退更新不会推送）。正式发布时选 false'
        required: false
        default: 'true'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.7'
          cache: true

      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then TAG="${{ github.event.inputs.version }}"; else TAG="${GITHUB_REF_NAME}"; fi
          NAME="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          # versionCode 由版本号推导（1.1.0 -> 10100），保证单调递增；
          # Flutter split-per-abi 会再加 ABI 偏移 abi*1000（arm64: 12100，armv7: 11100）
          IFS=. read -r MAJ MIN PAT <<< "${NAME%%-*}"
          NUM=$(( ${MAJ:-0} * 10000 + ${MIN:-0} * 100 + ${PAT:-0} ))
          echo "number=$NUM" >> "$GITHUB_OUTPUT"

      - name: Set up signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
          keytool -list -keystore android/app/release.jks -storepass "$KEYSTORE_PASSWORD" > /dev/null && echo "keystore OK"

      - run: flutter --version
      - run: flutter pub get

      - name: Build APK
        env:
          DZY_CONFIG_KEY: ${{ secrets.DZY_CONFIG_KEY }}
        run: |
          # v1.3.0 加固：Dart 代码混淆；符号表单独保存为构建产物（用于还原崩溃堆栈），不随 APK 发布
          flutter build apk --release --split-per-abi \
            --target-platform android-arm64,android-arm \
            --obfuscate --split-debug-info=build/debug-info \
            --build-name=${{ steps.ver.outputs.name }} \
            --build-number=${{ steps.ver.outputs.number }} \
            --dart-define=DZY_CONFIG_KEY="$DZY_CONFIG_KEY" \
            --dart-define=APP_VERSION=${{ steps.ver.outputs.name }}

      - name: Rename APKs
        run: |
          mkdir -p dist
          cd build/app/outputs/flutter-apk
          for f in app-*-release.apk; do
            abi="${f#app-}"; abi="${abi%-release.apk}"
            cp "$f" "../../../../dist/dzy-cloud-${{ steps.ver.outputs.tag }}-${abi}.apk"
          done
          ls -la ../../../../dist

      - uses: actions/upload-artifact@v4
        with:
          name: dzy-cloud-apk-${{ steps.ver.outputs.tag }}
          path: dist/*.apk

      # 混淆符号表（Dart --split-debug-info + R8 mapping.txt）：仅作为 Actions 构建产物保存，不公开发布
      - name: Collect symbols
        run: |
          mkdir -p symbols
          cp -r build/debug-info symbols/dart-debug-info
          if [ -f build/app/outputs/mapping/release/mapping.txt ]; then cp build/app/outputs/mapping/release/mapping.txt symbols/r8-mapping.txt; fi
          ls -laR symbols | head -50

      - uses: actions/upload-artifact@v4
        with:
          name: dzy-cloud-symbols-${{ steps.ver.outputs.tag }}
          path: symbols/
          retention-days: 90

      # 默认作为预发布：不会成为 GitHub latest，已安装旧版的用户不会通过 GitHub 回退渠道收到更新；
      # 官网 version.json 更新后再手动转为正式版（或以 prerelease=false 重新运行）。
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: 队长云加速 ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.event.inputs.prerelease != 'false' }}
          make_latest: ${{ github.event.inputs.prerelease == 'false' && 'true' || 'false' }}
          body: |
            队长云加速 Android ${{ steps.ver.outputs.tag }}（预发布测试版，官网正式上线前请勿外发）

            下载说明
            - 大多数手机请下载 arm64-v8a 版本；老旧 32 位设备用 armeabi-v7a。
            - 使用官网 (https://vip.dzgg666.de5.net) 账号的邮箱和密码登录。
            - 可直接覆盖安装旧版本，账号与设置会保留。

            v1.3.0 更新内容
            - 连接后自动验证能否正常上网，线路不可用时自动切换到其他线路
            - 线路列表按地区分组，每个地区优先显示最快的线路，可「展开全部」，支持下拉刷新
            - 连接更快：全部线路并发测速并记住测速结果，再次连接几乎无需等待
            - 连接过程中再次轻触即可取消
            - Wi-Fi 与移动数据切换时更稳定，不会误判线路故障而频繁切换
            - 手动选择的线路在官网更新测速信息后依然保留
            - 订阅兼容性提升：修复部分 Shadowsocks、Hysteria2、Trojan（WS/gRPC）线路无法连接，个别线路格式异常不再导致全部线路丢失
            - 套餐到期、账户停用等情况会直接提示原因，可一键前往官网续费；订阅更新过于频繁时继续使用已保存的线路
            - 新增下拉快捷设置开关「队长云加速」；连接通知显示当前线路，可一键断开
            - 退出登录会自动断开并清除本机线路缓存；切换账号不再沿用上一个账号的线路
            - 没有网络时打开 App 不再要求重新登录，启动更快
            - 本机流量统计（本次 / 累计），时长套餐显示到期时间
            - 应用内更新更可靠：下载中关闭弹窗可在后台继续，重新打开会接着显示进度
            - 安全加固：代码混淆、防抓包
          files: dist/*.apk
